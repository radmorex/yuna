name: tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: cargo test -q --manifest-path core/Cargo.toml
      - name: Python
        run: python3 -m unittest discover -s tests_py
