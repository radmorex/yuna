[package]
name = "mira-core"
version = "0.1.0"
edition = "2021"
description = "Мира — ИИ-соведущая для стрима: ядро (источники, мозг, TTS, сервер оверлея)"

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "signal", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
strip = false
debug = false
