[package]
name = "deflix_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "deflix_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
rayon = "1"
regex = "1"
sha2 = { version = "0.10", features = ["asm"] }  # аппаратные SHA-инструкции (как OpenSSL в hashlib)
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
